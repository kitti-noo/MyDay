<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="MyDay — แอปจัดการชีวิตประจำวัน: รายจ่าย นิสัย To-Do บันทึกย่อ ใช้งานออฟไลน์ได้">
  <title>MyDay — จัดการชีวิตประจำวัน</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyDay">

  <!-- Apply saved theme before first paint to avoid flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('myday_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav id="nav" class="nav" aria-label="เมนูหลัก"></nav>

  <main id="app" class="app-main">
    <noscript><p class="empty-state">MyDay ต้องเปิดใช้งาน JavaScript</p></noscript>
  </main>

  <!-- Scripts (load order matters: storage first, then modules, then app) -->
  <script src="js/storage.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/todos.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
